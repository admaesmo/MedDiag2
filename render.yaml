services:
  - type: web
    name: meddiag-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meddiag-db
          property: connectionString
      - key: MODEL_DIR
        value: "./saved_models"
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: meddiag-db
